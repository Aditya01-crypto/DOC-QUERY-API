[project]
name = "doc-query-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "cli-document-processor",
    "fastapi[standard]>=0.141.1",
    "pgvector>=0.5.0",
    "psycopg2-binary>=2.9.13",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.0.1",
    "sqlalchemy>=2.0.53",
]

[project.scripts]
dev = "doc_query_api.main:start"

# Required for package resolution inside src/
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doc_query_api"]

[tool.uv.sources]
cli-document-processor = { git = "https://github.com/Aditya01-crypto/CLI-Document-Processor.git" }

